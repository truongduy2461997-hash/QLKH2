name: QLKH2 - verify before deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check source, modules and loan workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate QLKH build integrity
        run: python build_modules.py --check --module qlkh
      - name: Check JavaScript syntax in HTML (no browser required)
        run: |
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          for file in ['index.html', 'src/qlkh.html', 'src/chitieu.html']:
              content = pathlib.Path(file).read_text(encoding='utf-8')
              scripts = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', content, re.I)
              for number, script in enumerate(scripts, start=1):
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode='w', suffix='.cjs', encoding='utf-8', delete=False) as tmp:
                      tmp.write(script)
                      path = tmp.name
                  try:
                      subprocess.run(['node', '--check', path], check=True)
                  finally:
                      pathlib.Path(path).unlink(missing_ok=True)
              print(f'Checked {file}: {len(scripts)} script blocks')
          PY
      - name: Unit regression - no Firebase/customer access
        run: node tests/qlkh_obligations.test.cjs
      - name: Legacy RTDB checkbox integration must remain off
        run: |
          python - <<'PY'
          import pathlib
          content = pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'const ENABLE_LEGACY_RTD_CHECKBOX_SYNC = false;' in content
          print('PASS: legacy checkbox autosync isolated in refactor stage 1')
          PY
      - name: Report known Chi tieu packaging drift (non-blocking)
        run: |
          python build_modules.py --check --module chitieu || echo "::warning::Chi tieu module differs from src/chitieu.html. Do not rebuild the production module until separately tested."
