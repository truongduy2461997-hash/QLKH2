<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QLKH Firebase Sync</title>

<style>
body{
    font-family:Arial,sans-serif;
}

#firebaseSyncStatus{
    position:fixed;
    right:12px;
    bottom:12px;
    z-index:999999;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.95);
    border:1px solid rgba(148,163,184,.25);
    box-shadow:0 4px 16px rgba(15,23,42,.15);
    font-size:12px;
    font-weight:600;
    color:#334155;
    cursor:pointer;
    backdrop-filter:blur(8px);
}

.sync-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#94A3B8;
}
</style>
</head>

<body>

<!-- PANEL CHỨA QLKH -->
<div id="panel-qlkh">

    <!--
    Đặt đường dẫn iframe của bạn tại đây
    Ví dụ:
    <iframe id="qlkhFrame" src="qlkh.html"></iframe>
    -->

    <iframe
        id="qlkhFrame"
        src=""
        width="100%"
        height="900"
        frameborder="0">
    </iframe>

</div>

<script>
(function () {
"use strict";

const FIREBASE_DB_URL =
"https://qlkh-c3298-default-rtdb.asia-southeast1.firebasedatabase.app/qlkh.json";

const SYNC_INTERVAL_MS = 3000;

let isSyncing = false;

function getIframe() {
    return (
        document.querySelector("#panel-qlkh #qlkhFrame") ||
        document.querySelector("#panel-qlkh iframe")
    );
}

function createStatusBadge() {

    let badge =
        document.getElementById(
            "firebaseSyncStatus"
        );

    if (badge) return badge;

    badge = document.createElement("div");

    badge.id = "firebaseSyncStatus";

    badge.innerHTML = `
        <span class="sync-dot"></span>
        <span class="sync-text">
            Đang kết nối Cloud...
        </span>
    `;

    badge.addEventListener(
        "click",
        syncFromCloud
    );

    document.body.appendChild(badge);

    return badge;
}

function updateBadge(state, text) {

    const badge = createStatusBadge();

    const dot =
        badge.querySelector(".sync-dot");

    const label =
        badge.querySelector(".sync-text");

    const colors = {
        syncing:"#F59E0B",
        success:"#16A34A",
        error:"#DC2626",
        idle:"#94A3B8"
    };

    dot.style.background =
        colors[state] || colors.idle;

    label.textContent = text;
}

function cleanStorage(
    customerId,
    isDone,
    storageObj
){
    if (!storageObj) return;

    try {

        const keys = [];

        for (
            let i = 0;
            i < storageObj.length;
            i++
        ){
            keys.push(
                storageObj.key(i)
            );
        }

        keys.forEach(key => {

            try {

                const raw =
                    storageObj.getItem(key);

                if (
                    !raw ||
                    !raw.includes(customerId)
                ){
                    return;
                }

                const data =
                    JSON.parse(raw);

                if (
                    Array.isArray(data)
                ){

                    const exists =
                        data.map(String)
                        .includes(
                            String(customerId)
                        );

                    if (
                        isDone &&
                        !exists
                    ){
                        data.push(customerId);

                        storageObj.setItem(
                            key,
                            JSON.stringify(data)
                        );
                    }

                    if (
                        !isDone &&
                        exists
                    ){

                        storageObj.setItem(
                            key,
                            JSON.stringify(
                                data.filter(
                                    x =>
                                    String(x)
                                    !==
                                    String(customerId)
                                )
                            )
                        );
                    }
                }

                else if (
                    typeof data === "object" &&
                    data !== null
                ){

                    if (isDone){
                        data[customerId] = true;
                    } else {
                        delete data[customerId];
                    }

                    storageObj.setItem(
                        key,
                        JSON.stringify(data)
                    );
                }

            } catch(e){}
        });

    } catch(e){
        console.warn(e);
    }
}

function updateCheckboxState(
    checkbox,
    target
){
    if (!checkbox) return false;

    if (
        checkbox.checked === target
    ){
        return false;
    }

    checkbox.click();

    if (
        checkbox.checked !== target
    ){

        checkbox.checked = target;

        checkbox.dispatchEvent(
            new Event("change", {
                bubbles:true
            })
        );
    }

    return true;
}

function restoreRow(row){

    row.style.display = "";

    row.hidden = false;

    row.classList.remove(
        "hidden",
        "d-none",
        "done",
        "completed",
        "is-done"
    );
}

function attemptUndo(row){

    const buttons =
        row.querySelectorAll(`
            button,
            a,
            .btn-restore,
            .btn-undo,
            [title*="Khôi phục"],
            [title*="Restore"]
        `);

    let changed = false;

    buttons.forEach(btn => {

        const text =
            (
                btn.textContent || ""
            ) +
            (
                btn.innerHTML || ""
            );

        if (
            /undo|restore|khôi phục|lấy lại|fa-undo|rotate/i
            .test(text)
        ){
            try{
                btn.click();
                changed = true;
            }
            catch(err){}
        }
    });

    return changed;
}

async function syncFromCloud(){

    if (isSyncing) return;

    const iframe = getIframe();

    if (!iframe) return;

    const iframeDoc =
        iframe.contentDocument ||
        iframe.contentWindow?.document;

    if (!iframeDoc) return;

    isSyncing = true;

    updateBadge(
        "syncing",
        "Đang đồng bộ..."
    );

    try{

        const response =
            await fetch(
                FIREBASE_DB_URL,
                {
                    cache:"no-store"
                }
            );

        if (!response.ok){
            throw new Error();
        }

        const cloudData =
            await response.json();

        let changed = false;

        Object.entries(cloudData || {})
        .forEach(([key,item]) => {

            const customerId =
                key
                .replace("VAY_","")
                .replace("GUI_","")
                .trim();

            const isDone =
                item?.daXuLy === true;

            cleanStorage(
                customerId,
                isDone,
                localStorage
            );

            try{
                cleanStorage(
                    customerId,
                    isDone,
                    iframe.contentWindow.localStorage
                );
            }catch(e){}

            const rows =
                iframeDoc.querySelectorAll(`
                    tr,
                    .customer-item,
                    .card-row,
                    .customer-row
                `);

            rows.forEach(row => {

                const text =
                    row.textContent || "";

                if (
                    !text.includes(
                        customerId
                    )
                ){
                    return;
                }

                const checkbox =
                    row.querySelector(
                        "input[type='checkbox']"
                    );

                if (isDone){

                    if (
                        updateCheckboxState(
                            checkbox,
                            true
                        )
                    ){
                        changed = true;
                    }

                } else {

                    if (
                        attemptUndo(row)
                    ){
                        changed = true;
                    }

                    if (
                        updateCheckboxState(
                            checkbox,
                            false
                        )
                    ){
                        changed = true;
                    }

                    restoreRow(row);
                }
            });
        });

        if (changed){

            const filterObj =
                iframeDoc.querySelector(
                    "select,#btnFilter,.filter-active"
                );

            if (filterObj){

                filterObj.dispatchEvent(
                    new Event(
                        "change",
                        {
