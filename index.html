<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khôi phục bản gốc Firebase Sync</title>
</head>
<body>

<!-- Dán vào trang hiện có -->
<script>
(function () {
  "use strict";

  const FIREBASE_DB_URL = "https://qlkh-c3298-default-rtdb.asia-southeast1.firebasedatabase.app/qlkh.json";
  const FIREBASE_SYNC_INTERVAL_MS = 3000;
  let firebaseSyncRunning = false;

  function getQlkhIframe() {
    return document.querySelector("#panel-qlkh #qlkhFrame") || document.querySelector("#panel-qlkh iframe");
  }

  function createSyncStatus() {
    let status = document.getElementById("firebaseSyncStatus");
    if (status) return status;

    status = document.createElement("div");
    status.id = "firebaseSyncStatus";
    status.innerHTML = '<span class="firebase-sync-dot"></span><span class="firebase-sync-text">Đang kết nối Firebase...</span>';

    status.addEventListener("click", dongBoFirebaseVaoWeb);
    document.body.appendChild(status);
    return status;
  }

  function updateSyncStatus(state, text) {
    const status = createSyncStatus();
    const label = status.querySelector(".firebase-sync-text");
    if (label) label.innerText = text;
  }

  async function dongBoFirebaseVaoWeb() {
    if (firebaseSyncRunning) return;

    const iframe = getQlkhIframe();
    if (!iframe || !iframe.contentDocument) return;

    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
    const rows = iframeDoc.querySelectorAll("tr");

    firebaseSyncRunning = true;

    try {
      const response = await fetch(FIREBASE_DB_URL);
      if (!response.ok) throw new Error("Mất kết nối");

      const data = await response.json();

      if (data) {
        Object.keys(data).forEach(key => {
          const item = data[key];
          const isDone = item.daXuLy === true;
          const customerId = key.replace("VAY_", "").replace("GUI_", "").trim();

          rows.forEach(row => {
            const rowText = row.textContent || "";

            if (rowText.includes(customerId)) {
              const checkbox = row.querySelector("input[type='checkbox']");

              if (checkbox) {
                if (checkbox.checked !== isDone) {
                  checkbox.click();

                  if (checkbox.checked !== isDone) {
                    checkbox.checked = isDone;
                    checkbox.dispatchEvent(new Event("change", { bubbles: true }));
                  }
                }

                if (!isDone) {
                  row.style.display = "";
                  row.classList.remove("hidden", "d-none");
                }
              }
            }
          });
        });
      }

      updateSyncStatus("success", "Đồng bộ thành công");

    } catch (err) {
      updateSyncStatus("error", "Lỗi kết nối Firebase");
    } finally {
      firebaseSyncRunning = false;
    }
  }

  window.addEventListener("load", () => {
    createSyncStatus();
    setTimeout(dongBoFirebaseVaoWeb, 1500);
    setInterval(dongBoFirebaseVaoWeb, FIREBASE_SYNC_INTERVAL_MS);
  });

  window.addEventListener("focus", dongBoFirebaseVaoWeb);
})();
</script>

</body>
</html>
